<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155d42" />
    <title>Hors connexion — Boutiques locales</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f7f1;
        color: #1e2c24;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(100% - 2rem, 32rem);
        padding: 2rem;
        border: 1px solid #dce5dc;
        border-radius: 1.35rem;
        background: #fff;
      }

      h1 {
        margin-top: 0;
        color: #155d42;
      }

      p {
        line-height: 1.6;
      }

      .private-data {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .private-data[hidden] {
        display: none;
      }

      .private-record {
        padding: 1rem;
        border: 1px solid #dce5dc;
        border-radius: 0.9rem;
      }

      .private-record h3 {
        margin: 0 0 0.5rem;
      }

      .private-record p,
      .private-record ul {
        margin: 0.4rem 0;
      }

      .private-record ul {
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tu es hors connexion</h1>
      <p>
        Cette page n’est pas enregistrée. Les commandes et rendez-vous chargés
        précédemment restent consultables ci-dessous.
      </p>
      <p>
        Consultation uniquement : les modifications, avis, annulations et
        paiements nécessitent une connexion.
      </p>
      <section
        aria-labelledby="private-data-title"
        class="private-data"
        hidden
        id="private-offline-data"
      >
        <h2 id="private-data-title">
          Tes données enregistrées sur cet appareil
        </h2>
        <p id="private-data-empty"></p>
        <div id="private-data-orders"></div>
        <div id="private-data-bookings"></div>
      </section>
    </main>
    <script src="/pwa-offline.js" defer></script>
  </body>
</html>
